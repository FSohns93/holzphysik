<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <g stroke="#000" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer cut -->
    <circle cx="300" cy="300" r="280" stroke-width="2.5"/>

    <!-- Inner decorative ring -->
    <circle cx="300" cy="300" r="260" stroke-width="0.8"/>
    <circle cx="300" cy="300" r="250" stroke-width="0.5" stroke-dasharray="2,4"/>

    <!-- ========================= -->
    <!-- CENTER: Holz + Schwarzes Loch -->
    <!-- ========================= -->
    <g stroke-width="0.8">
      <!-- Holzringe -->
      <path d="M300 300
               m-5,0 a5,4 0 1,0 10,0 a5,4 0 1,0 -10,0"/>
      <path d="M300 300
               m-12,0 a12,9 0 1,0 24,0 a12,9 0 1,0 -24,0"/>
      <path d="M300 300
               m-20,0 a20,15 0 1,0 40,0 a20,15 0 1,0 -40,0"/>

      <!-- Verzerrte Raumzeit -->
      <path d="M220 300 Q300 260 380 300"/>
      <path d="M230 300 Q300 280 370 300"/>
      <path d="M240 300 Q300 290 360 300"/>
      <path d="M260 300 Q300 310 340 300"/>
      <path d="M220 300 Q300 340 380 300"/>
    </g>

    <!-- ========================= -->
    <!-- 1: Teilchenkollision -->
    <!-- ========================= -->
    <g transform="translate(300,110)" stroke-width="0.8">
      <circle r="85"/>

      <!-- einlaufende Teilchen -->
      <line x1="-85" y1="0" x2="-10" y2="0"/>
      <line x1="85" y1="0" x2="10" y2="0"/>

      <!-- Kollisionszentrum -->
      <circle r="4"/>

      <!-- Explosion -->
      <g stroke-dasharray="2,5">
        <line x1="0" y1="0" x2="60" y2="40"/>
        <line x1="0" y1="0" x2="-60" y2="-30"/>
        <line x1="0" y1="0" x2="40" y2="-60"/>
        <line x1="0" y1="0" x2="-30" y2="60"/>
      </g>

      <!-- Spiralige Energie -->
      <path d="M0 0 Q20 -10 30 10 T60 20"/>
      <path d="M0 0 Q-20 10 -30 -10 T-60 -20"/>
    </g>

    <!-- ========================= -->
    <!-- 2: Atom + Holzstruktur -->
    <!-- ========================= -->
    <g transform="translate(120,260)" stroke-width="0.7">
      <circle r="85"/>

      <!-- Holzringe -->
      <path d="M0 0 m-10 0 a10 8 0 1 0 20 0 a10 8 0 1 0 -20 0"/>
      <path d="M0 0 m-20 0 a20 14 0 1 0 40 0 a20 14 0 1 0 -40 0"/>

      <!-- Orbitale -->
      <ellipse rx="70" ry="25"/>
      <ellipse rx="70" ry="25" transform="rotate(60)"/>
      <ellipse rx="70" ry="25" transform="rotate(-60)"/>

      <!-- Elektronen -->
      <circle cx="70" cy="0" r="2"/>
      <circle cx="-35" cy="60" r="2"/>
      <circle cx="-35" cy="-60" r="2"/>
    </g>

    <!-- ========================= -->
    <!-- 4: Nebelkammer -->
    <!-- ========================= -->
    <g transform="translate(480,260)" stroke-width="0.7">
      <circle r="85"/>

      <!-- zufällige Tracks -->
      <path d="M-60,60 Q-30,-40 20,40 T70,-20" stroke-dasharray="1,4"/>
      <path d="M-70,40 Q0,-60 60,30" stroke-dasharray="2,5"/>
      <path d="M-50,20 Q10,-30 50,50" stroke-dasharray="1,3"/>

      <!-- Kondensationspunkte -->
      <g>
        <circle cx="-20" cy="10" r="1.5"/>
        <circle cx="10" cy="-20" r="1.5"/>
        <circle cx="30" cy="25" r="1.5"/>
      </g>
    </g>

    <!-- ========================= -->
    <!-- 5: Schwarzes Loch (unten links) -->
    <!-- ========================= -->
    <g transform="translate(180,470)" stroke-width="0.8">
      <circle r="85"/>

      <circle r="12"/>

      <!-- Akkretionsscheibe -->
      <path d="M-70 0 A70 70 0 0 1 70 0"/>
      <path d="M-55 0 A55 55 0 0 1 55 0"/>
      <path d="M-40 0 A40 40 0 0 1 40 0"/>

      <!-- Spiral -->
      <path d="M0 0 Q30 -20 40 10 T70 20"/>
      <path d="M0 0 Q-30 20 -40 -10 T-70 -20"/>
    </g>

    <!-- ========================= -->
    <!-- 6: Sonneneruption / Holz -->
    <!-- ========================= -->
    <g transform="translate(420,470)" stroke-width="0.8">
      <circle r="85"/>

      <!-- Holzringe -->
      <path d="M0 0 m-10 0 a10 8 0 1 0 20 0 a10 8 0 1 0 -20 0"/>
      <path d="M0 0 m-25 0 a25 18 0 1 0 50 0 a25 18 0 1 0 -50 0"/>

      <!-- Eruption -->
      <path d="M0,-25 Q20,-70 60,-90"/>
      <path d="M0,-25 Q-20,-70 -60,-90"/>
      <path d="M0,-25 Q10,-100 0,-120"/>

      <!-- Plasma-Strukturen -->
      <path d="M20,-60 Q40,-80 50,-60"/>
      <path d="M-20,-60 Q-40,-80 -50,-60"/>
    </g>

  </g>
</svg>